<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAPEHAUS — Test Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Courier New', monospace; background: #0b0b10; color: #e2e8f0; padding: 24px; }
    h1 { font-size: 1.4rem; color: #8b5cf6; margin-bottom: 4px; }
    .suite-meta { font-size: 0.8rem; color: #64748b; margin-bottom: 24px; }
    .suite { margin-bottom: 28px; }
    .suite-title { font-size: 1rem; font-weight: 700; color: #22d3ee; border-bottom: 1px solid #1e293b; padding-bottom: 6px; margin-bottom: 10px; }
    .test { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 0.82rem; border-bottom: 1px solid #0f172a; }
    .test:last-child { border-bottom: none; }
    .icon { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .skip { color: #94a3b8; }
    .test-name { flex: 1; }
    .test-error { font-size: 0.75rem; color: #f87171; margin-top: 2px; }
    #summary { position: sticky; top: 0; background: #0b0b10; border-bottom: 1px solid #1e293b; padding: 12px 0 16px; margin-bottom: 24px; font-size: 0.88rem; }
    #summary .totals { display: flex; gap: 20px; margin-top: 6px; }
    .total-pass { color: #4ade80; font-weight: 700; }
    .total-fail { color: #f87171; font-weight: 700; }
    .total-skip { color: #94a3b8; }
    .progress-bar { height: 4px; background: #1e293b; border-radius: 2px; margin-top: 10px; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  </style>
</head>
<body>

<div id="summary">
  <h1>VAPEHAUS Test Suite <a href="api-tests.php" style="color: #22d3ee; font-size: 0.8rem; text-decoration: none; font-weight: normal; margin-left: 12px;">[Run PHP Backend Tests →]</a></h1>
  <div class="suite-meta" id="suite-meta">Initializing…</div>
  <div class="totals">
    <span class="total-pass">✓ <span id="count-pass">0</span> passed</span>
    <span class="total-fail">✗ <span id="count-fail">0</span> failed</span>
    <span class="total-skip">⊘ <span id="count-skip">0</span> skipped</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="background:#4ade80;width:0%;"></div></div>
</div>

<div id="test-output"></div>

<!-- Load production modules (same order as index.html) -->
<script src="js/config.js"></script>
<script src="js/domain/order-status.js"></script>
<script src="js/domain/money.js"></script>
<script src="js/store/state.js"></script>
<script src="js/api/client.js"></script>

<script>
// ============================================================
// VAPEHAUS TEST HARNESS
// Deterministic micro-framework — no external dependencies.
// Red-Green contract: every test must pass before deployment.
// ============================================================

const TestRunner = (() => {
  const results = { pass: 0, fail: 0, skip: 0, total: 0 };
  const suites  = [];
  let currentSuite = null;

  const describe   = (name, fn) => { currentSuite = { name, tests: [] }; suites.push(currentSuite); fn(); currentSuite = null; };
  const it         = (name, fn) => currentSuite.tests.push({ name, fn, skip: false });
  const xit        = (name)     => currentSuite.tests.push({ name, fn: null, skip: true });

  const assert      = (cond, msg)   => { if (!cond) throw new Error(msg || 'Assertion failed'); };
  const assertEqual = (a, b, msg)   => { if (a !== b) throw new Error(msg || `Expected ${JSON.stringify(a)} === ${JSON.stringify(b)}`); };
  const assertThrows = (fn, needle) => {
    let threw = false;
    try { fn(); } catch (e) {
      threw = true;
      if (needle && !e.message.toLowerCase().includes(needle.toLowerCase()))
        throw new Error(`Expected error containing "${needle}" but got: "${e.message}"`);
    }
    if (!threw) throw new Error('Expected function to throw but it did not');
  };

  async function run() {
    const output = document.getElementById('test-output');
    const t0 = performance.now();
    const helpers = { assert, assertEqual, assertThrows };

    for (const suite of suites) {
      const el = document.createElement('div');
      el.className = 'suite';
      el.innerHTML = `<div class="suite-title">${suite.name}</div>`;
      output.appendChild(el);

      for (const test of suite.tests) {
        results.total++;
        const row = document.createElement('div');
        row.className = 'test';

        if (test.skip) {
          results.skip++;
          row.innerHTML = `<span class="icon skip">⊘</span><div><div class="test-name skip">${test.name}</div></div>`;
        } else {
          try {
            await test.fn(helpers);
            results.pass++;
            row.innerHTML = `<span class="icon pass">✓</span><div><div class="test-name">${test.name}</div></div>`;
          } catch (err) {
            results.fail++;
            row.innerHTML = `<span class="icon fail">✗</span><div><div class="test-name fail">${test.name}</div><div class="test-error">${err.message}</div></div>`;
          }
        }
        el.appendChild(row);
      }
    }

    const ms  = (performance.now() - t0).toFixed(1);
    const pct = results.total > 0 ? ((results.pass / (results.pass + results.fail)) * 100).toFixed(0) : 0;
    document.getElementById('count-pass').textContent   = results.pass;
    document.getElementById('count-fail').textContent   = results.fail;
    document.getElementById('count-skip').textContent   = results.skip;
    document.getElementById('suite-meta').textContent   = `${results.total} tests · ${ms}ms · ${pct}% pass rate`;
    document.getElementById('progress-fill').style.width      = pct + '%';
    document.getElementById('progress-fill').style.background = results.fail > 0 ? '#f87171' : '#4ade80';
  }

  return { describe, it, xit, run };
})();

const { describe, it, xit } = TestRunner;
const assert      = (c, m)    => { if (!c) throw new Error(m || 'Assertion failed'); };
const assertEqual = (a, b, m) => { if (a !== b) throw new Error(m || `Expected ${JSON.stringify(a)} === ${JSON.stringify(b)}`); };
const assertThrows = (fn, needle) => {
  let threw = false;
  try { fn(); } catch (e) {
    threw = true;
    if (needle && !e.message.toLowerCase().includes(needle.toLowerCase()))
      throw new Error(`Expected "${needle}" in error but got: "${e.message}"`);
  }
  if (!threw) throw new Error('Expected function to throw but it did not');
};

// ── HELPERS ──────────────────────────────────────────────────

function freshStore() {
  const s = new VapehausStore();
  s.state.users = [
    { ...CONFIG.DEFAULT_USER,  email: CONFIG.DEFAULT_USER.email.toLowerCase()  },
    { ...CONFIG.DEFAULT_ADMIN, email: CONFIG.DEFAULT_ADMIN.email.toLowerCase() },
  ];
  s.state.currentUser = null;
  s.state.cart = { items: [], appliedCouponCode: null };
  return s;
}

function customerStore() {
  const s = freshStore();
  s.state.currentUser = { ...CONFIG.DEFAULT_USER, role: 'customer' };
  return s;
}

function adminStore() {
  const s = freshStore();
  s.state.currentUser = { ...CONFIG.DEFAULT_ADMIN, role: 'admin' };
  return s;
}

function dob(yearsAgo) {
  const d = new Date();
  d.setFullYear(d.getFullYear() - yearsAgo);
  return d.toISOString().split('T')[0];
}

// ============================================================
// SUITE 1 — CONFIG
// ============================================================
describe('CONFIG — Determinism & Immutability', () => {
  it('has required top-level keys', () => {
    assert(typeof CONFIG.APP_NAME === 'string');
    assert(typeof CONFIG.API_BASE_URL === 'string');
    assert(typeof CONFIG.ENABLE_LOCAL_FALLBACK === 'boolean');
  });
  it('currency is PHP / ₱', () => {
    assertEqual(CONFIG.CURRENCY.CODE, 'PHP');
    assertEqual(CONFIG.CURRENCY.SYMBOL, '₱');
  });
  it('free-shipping threshold is 1500', () => {
    assertEqual(CONFIG.SHIPPING.FREE_SHIPPING_THRESHOLD, 1500);
  });
  it('minimum legal age is 18 (RA 11900)', () => {
    assertEqual(CONFIG.LEGAL.MIN_AGE, 18);
  });
  it('CONFIG is frozen (write throws in strict mode)', () => {
    assertThrows(() => { 'use strict'; CONFIG.HACKED = true; });
  });
});

// ============================================================
// SUITE 2 — Money
// ============================================================
describe('Money — Philippine Peso Formatting', () => {
  it('formats whole amount correctly', () => assertEqual(Money.format(1500),    '₱1,500.00'));
  it('formats fractional amount correctly', () => assertEqual(Money.format(3490.5), '₱3,490.50'));
  it('formats zero correctly', () => assertEqual(Money.format(0), '₱0.00'));
  it('toCents: 13.99 → 1399',  () => assertEqual(Money.toCents(13.99),  1399));
  it('fromCents: 1399 → 13.99', () => assertEqual(Money.fromCents(1399), 13.99));
  it('toCents / fromCents are inverse', () => {
    const v = 129.50;
    assertEqual(Money.fromCents(Money.toCents(v)), v);
  });
});

// ============================================================
// SUITE 3 — OrderStatus state machine
// ============================================================
describe('OrderStatus — State Machine', () => {
  it('exposes 6 canonical statuses', () => {
    [OrderStatus.PENDING, OrderStatus.PROCESSING, OrderStatus.SHIPPED,
     OrderStatus.OUT_FOR_DELIVERY, OrderStatus.DELIVERED, OrderStatus.CANCELLED]
    .forEach((s) => assert(typeof s === 'string' && s.length > 0));
  });
  it('pending → processing  (valid)', () => assert(OrderStatus.canTransitionTo(OrderStatus.PENDING,          OrderStatus.PROCESSING)       === true));
  it('processing → shipped  (valid)', () => assert(OrderStatus.canTransitionTo(OrderStatus.PROCESSING,       OrderStatus.SHIPPED)           === true));
  it('shipped → out_for_delivery (valid)', () => assert(OrderStatus.canTransitionTo(OrderStatus.SHIPPED,     OrderStatus.OUT_FOR_DELIVERY)  === true));
  it('out_for_delivery → delivered (valid)', () => assert(OrderStatus.canTransitionTo(OrderStatus.OUT_FOR_DELIVERY, OrderStatus.DELIVERED)  === true));
  it('delivered → pending   (invalid — no reversal)', () => assert(OrderStatus.canTransitionTo(OrderStatus.DELIVERED, OrderStatus.PENDING)  === false));
  it('delivered → cancelled (invalid — terminal)', () => assert(OrderStatus.canTransitionTo(OrderStatus.DELIVERED,  OrderStatus.CANCELLED) === false));
  it('getLabel returns non-empty string', () => {
    const lbl = OrderStatus.getLabel(OrderStatus.PENDING);
    assert(typeof lbl === 'string' && lbl.length > 0);
  });
  it('getBadgeClass returns a CSS badge class', () => {
    const cls = OrderStatus.getBadgeClass(OrderStatus.SHIPPED);
    assert(typeof cls === 'string' && cls.includes('badge'));
  });
});

// ============================================================
// SUITE 4 — RBAC / Auth
// ============================================================
describe('VapehausStore — Authentication & RBAC', () => {
  it('guest is not authenticated', () => assert(!freshStore().isAuthenticated()));
  it('isAdmin() false for guest', () => assert(!freshStore().isAdmin()));

  it('login() valid customer sets session', () => {
    const s = freshStore();
    const u = s.login(CONFIG.DEFAULT_USER.email, 'VapePass123!');
    assertEqual(u.role, 'customer');
    assert(s.isAuthenticated());
  });

  it('login() valid admin sets admin session', () => {
    const s = freshStore();
    const u = s.login(CONFIG.DEFAULT_ADMIN.email, 'AdminPass123!');
    assertEqual(u.role, 'admin');
    assert(s.isAdmin());
  });

  it('login() unknown email throws', () => {
    assertThrows(() => freshStore().login('ghost@nowhere.ph', 'pass'), 'No account found');
  });

  it('login() empty email throws', () => {
    assertThrows(() => freshStore().login('', 'pass'), 'email');
  });

  it('login() empty password throws', () => {
    assertThrows(() => freshStore().login('customer@vapehaus.ph', ''), 'password');
  });

  it('logout() clears session', () => {
    const s = freshStore();
    s.login(CONFIG.DEFAULT_USER.email, 'any');
    s.logout();
    assert(!s.isAuthenticated());
  });

  it('setSessionFromApi() normalises snake_case fields', () => {
    const s = freshStore();
    s.setSessionFromApi({ id: 'x', email: 'api@vapehaus.ph', first_name: 'Maria', last_name: 'Santos', role: 'customer', is_age_verified: true });
    assertEqual(s.getCurrentUser().firstName, 'Maria');
    assertEqual(s.getCurrentUser().email, 'api@vapehaus.ph');
  });

  it('hasRole() returns true for matching role', () => {
    const s = customerStore();
    assert(s.hasRole('customer') === true);
    assert(s.hasRole('admin') === false);
  });
});

// ============================================================
// SUITE 5 — Cart & Coupon
// ============================================================
describe('VapehausStore — Cart & Coupon', () => {
  it('cart starts empty', () => assertEqual(customerStore().getState().cart.items.length, 0));

  it('addToCart() adds a variant', () => {
    const s = customerStore();
    s.addToCart(s.getProducts()[0].variants[0].id, 1);
    assertEqual(s.getState().cart.items.length, 1);
  });

  it('addToCart() increments quantity on duplicate', () => {
    const s = customerStore();
    const vid = s.getProducts()[0].variants[0].id;
    s.addToCart(vid, 1);
    s.addToCart(vid, 2);
    assertEqual(s.getState().cart.items[0].quantity, 3);
  });

  it('removeFromCart() removes item', () => {
    const s = customerStore();
    const vid = s.getProducts()[0].variants[0].id;
    s.addToCart(vid, 1);
    s.removeFromCart(vid);
    assertEqual(s.getState().cart.items.length, 0);
  });

  it('getCartTotals() subtotal is price × qty', () => {
    const s = customerStore();
    const v = s.getProducts()[0].variants[0];
    s.addToCart(v.id, 2);
    assertEqual(s.getCartTotals().subtotal, v.price * 2);
  });

  it('free shipping when subtotal >= 1500', () => {
    const s = customerStore();
    s.addToCart(s.getProducts()[0].variants[0].id, 1); // 3490
    assertEqual(s.getCartTotals().shippingFee, 0);
  });

  it('standard shipping when subtotal < 1500', () => {
    const s = customerStore();
    s.addToCart(s.getProducts()[1].variants[0].id, 1); // 1290
    assertEqual(s.getCartTotals().shippingFee, CONFIG.SHIPPING.STANDARD_FEE);
  });

  it('HAUS10 applies 10% discount', () => {
    const s = customerStore();
    const v = s.getProducts()[0].variants[0];
    s.addToCart(v.id, 1);
    s.applyCoupon('HAUS10');
    const disc = s.getCartTotals().discountAmount;
    assert(Math.abs(disc - v.price * 0.1) < 0.01);
  });

  it('invalid coupon throws', () => {
    assertThrows(() => customerStore().applyCoupon('FAKECODE'), 'invalid');
  });

  it('removeCoupon() zeroes discount', () => {
    const s = customerStore();
    s.addToCart(s.getProducts()[0].variants[0].id, 1);
    s.applyCoupon('HAUS10');
    s.removeCoupon();
    assertEqual(s.getCartTotals().discountAmount, 0);
  });
});

// ============================================================
// SUITE 6 — Registration & 18+ Enforcement
// ============================================================
describe('VapehausStore — Registration & Age Enforcement', () => {
  it('valid 18+ registration creates account', () => {
    const s = freshStore(); s.state.users = [];
    const u = s.register({ firstName: 'Maria', lastName: 'Santos', email: 'maria@test.ph',
      phone: '+63 917 000 1111', birthDate: dob(20), password: 'Pass1!', isAgeAttested: true });
    assertEqual(u.role, 'customer');
    assert(u.isAgeVerified === true);
  });

  it('underage birthdate throws', () => {
    const s = freshStore(); s.state.users = [];
    assertThrows(() => s.register({ firstName: 'Teen', lastName: 'User', email: 'teen@test.ph',
      phone: '+63 917 000 2222', birthDate: dob(15), password: 'Pass1!', isAgeAttested: true }), 'Underage');
  });

  it('missing attestation throws', () => {
    const s = freshStore(); s.state.users = [];
    assertThrows(() => s.register({ firstName: 'No', lastName: 'Attest', email: 'na@test.ph',
      phone: '+63 917 000 3333', birthDate: dob(25), password: 'Pass1!', isAgeAttested: false }), 'attestation');
  });

  it('missing birthdate throws', () => {
    const s = freshStore(); s.state.users = [];
    assertThrows(() => s.register({ firstName: 'No', lastName: 'DOB', email: 'nd@test.ph',
      phone: '+63 917 000 4444', birthDate: '', password: 'Pass1!', isAgeAttested: true }), 'Birth date');
  });
});

// ============================================================
// SUITE 7 — Admin RBAC Guards
// ============================================================
describe('VapehausStore — Admin RBAC Guards', () => {
  it('customer cannot update order status', () => {
    assertThrows(() => customerStore().updateOrderStatus('x', OrderStatus.PROCESSING), 'Access Denied');
  });
  it('customer cannot add product', () => {
    assertThrows(() => customerStore().addProduct({ name: 'H', brand: 'X', price: 100 }), 'Access Denied');
  });
  it('customer cannot create coupon', () => {
    assertThrows(() => customerStore().createCoupon({ code: 'H', discountPercent: 100 }), 'Access Denied');
  });
  it('customer cannot update stock', () => {
    assertThrows(() => customerStore().updateVariantStock('var_1_1', 99), 'Access Denied');
  });
  it('admin can add product', () => {
    const p = adminStore().addProduct({ name: 'Test Mod', brand: 'TESTCO', category: 'devices', price: 1500, description: 'Test.' });
    assert(p.id.startsWith('prod_'));
    assert(p.variants.length > 0);
  });
  it('admin can create coupon', () => {
    const c = adminStore().createCoupon({ code: 'TEST20', discountPercent: 20, minSpend: 0 });
    assertEqual(c.code, 'TEST20');
    assert(c.isActive === true);
  });
  it('admin can update variant stock (absolute)', () => {
    const v = adminStore().updateVariantStock('var_1_1', 50);
    assertEqual(v.stock, 50);
  });
  it('admin can transition order from pending → processing', () => {
    const cs = customerStore();
    const order = cs.placeOrder({ customerName: 'Test', customerEmail: 't@t.ph',
      customerPhone: '+63 900 000 0001', shippingAddress: 'Manila', paymentMethod: 'cod', isAgeAttested: true });
    const as = adminStore();
    as.state.orders = cs.state.orders;
    const updated = as.updateOrderStatus(order.id, OrderStatus.PROCESSING);
    assertEqual(updated.status, OrderStatus.PROCESSING);
  });
});

// ============================================================
// SUITE 8 — placeOrder() & Inventory Deduction
// ============================================================
describe('VapehausStore — Order Placement', () => {
  it('produces order with VH- prefix', () => {
    const s = customerStore();
    s.addToCart(s.getProducts()[0].variants[0].id, 1);
    const o = s.placeOrder({ customerName: 'Juan', customerEmail: 'j@test.ph',
      customerPhone: '+63 900 000 0000', shippingAddress: 'Manila', paymentMethod: 'gcash', isAgeAttested: true });
    assert(o.orderNumber.startsWith('VH-'));
    assertEqual(o.status, OrderStatus.PENDING);
  });

  it('throws without age attestation', () => {
    const s = customerStore();
    assertThrows(() => s.placeOrder({ customerName: 'T', customerEmail: 't@t.ph',
      customerPhone: '+63 900', shippingAddress: 'Manila', paymentMethod: 'cod', isAgeAttested: false }), 'age');
  });

  it('deducts stock from ordered variant', () => {
    const s = customerStore();
    const v = s.getProducts()[0].variants[0];
    const before = v.stock;
    s.addToCart(v.id, 1);
    s.placeOrder({ customerName: 'J', customerEmail: 'j@t.ph',
      customerPhone: '+63 900', shippingAddress: 'Manila', paymentMethod: 'cod', isAgeAttested: true });
    assertEqual(s.getVariantById(v.id).variant.stock, before - 1);
  });

  it('clears cart after placement', () => {
    const s = customerStore();
    s.addToCart(s.getProducts()[0].variants[0].id, 1);
    s.placeOrder({ customerName: 'J', customerEmail: 'j@t.ph',
      customerPhone: '+63 900', shippingAddress: 'Manila', paymentMethod: 'cod', isAgeAttested: true });
    assertEqual(s.getState().cart.items.length, 0);
  });
});

// ============================================================
// SUITE 9 — ApiClient Local Fallback
// ============================================================
describe('ApiClient — Local Fallback Adapter', () => {
  it('getProducts() returns success envelope with array', async () => {
    const r = await Api.getProducts();
    assert(r.success === true);
    assert(Array.isArray(r.data) && r.data.length > 0);
  });
  it('getProducts(category=devices) returns only devices', async () => {
    const r = await Api.getProducts({ category: 'devices' });
    assert(r.success === true);
    assert(r.data.every((p) => p.category === 'devices'));
  });
  it('getProductDetail(prod_1) returns correct product', async () => {
    const r = await Api.getProductDetail('prod_1');
    assert(r.success === true);
    assertEqual(r.data.id, 'prod_1');
  });
  it('getProductDetail(unknown) returns NOT_FOUND error', async () => {
    const r = await Api.getProductDetail('prod_does_not_exist_99999');
    assert(r.success === false);
    assertEqual(r.error.code, 'NOT_FOUND');
  });
  it('getCategories() returns >= 5 categories', async () => {
    const r = await Api.getCategories();
    assert(r.success === true && r.data.length >= 5);
  });
  it('getDashboardMetrics() returns metric shape', async () => {
    const r = await Api.getDashboardMetrics();
    assert(r.success === true);
    assert(typeof r.data.total_orders === 'number');
    assert(typeof r.data.total_revenue === 'number');
    assert(typeof r.data.active_products === 'number');
  });
  it('login() with valid credentials returns success envelope', async () => {
    // Seed the global Store with demo users for this test
    Store.state.users = [
      { ...CONFIG.DEFAULT_USER,  email: CONFIG.DEFAULT_USER.email.toLowerCase()  },
      { ...CONFIG.DEFAULT_ADMIN, email: CONFIG.DEFAULT_ADMIN.email.toLowerCase() },
    ];
    const r = await Api.login(CONFIG.DEFAULT_USER.email, 'VapePass123!');
    assert(r.success === true);
    assert(r.data.user && r.data.user.role === 'customer');
  });
  it('login() with unknown email returns error envelope', async () => {
    Store.state.users = [
      { ...CONFIG.DEFAULT_USER,  email: CONFIG.DEFAULT_USER.email.toLowerCase()  },
      { ...CONFIG.DEFAULT_ADMIN, email: CONFIG.DEFAULT_ADMIN.email.toLowerCase() },
    ];
    const r = await Api.login('ghost@nowhere.ph', 'BadPass');
    assert(r.success === false);
    assert(typeof r.error.message === 'string');
  });
});

// ============================================================
// RUN
// ============================================================
window.addEventListener('DOMContentLoaded', () => TestRunner.run());
</script>
</body>
</html>
