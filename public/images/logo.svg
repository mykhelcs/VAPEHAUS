<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" width="230" height="48" fill="none">
  <!-- Canva-Style Grounded Retail Logo: Solid Flat Colors, Zero Gradients, Zero Glow -->

  <!-- Brand Mark Badge Container (Solid Slate) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#1e222d" stroke="#2e3546" stroke-width="1.5" />
    
    <!-- Architectural HAUS Gable Roof + Solid Chimney -->
    <path d="M 10 18 L 20 9 L 30 18" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 27 12 L 27 7 L 29.5 7 L 29.5 14" fill="#ffffff" />
    
    <!-- Iconic Solid Vapor Swirl (Canva Style Graphic Element) -->
    <path d="M 14 26 C 14 22.5 17 21 20 22.8 C 23 21 26 22.5 26 26 C 26 29.5 22 33 20 34 C 18 33 14 29.5 14 26 Z" fill="#38bdf8" />
    <circle cx="20" cy="25" r="1.8" fill="#1e222d" />
  </g>

  <!-- Brand Typography (Solid, High-Legibility) -->
  <g transform="translate(54, 30)">
    <text x="0" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" letter-spacing="0.04em" fill="#ffffff">VAPE</text>
    <text x="64" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" letter-spacing="0.04em" fill="#38bdf8">HAUS</text>
    <text x="1" y="10" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="6.8" letter-spacing="0.22em" fill="#94a3b8">PREMIUM VAPOR CO. · PH</text>
  </g>
</svg>
